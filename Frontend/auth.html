<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Rizq Share</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>

  <main class="auth">
    <aside class="auth-side">
      <h2>Every meal you share is one less wasted.</h2>
      <p>Join donors and receivers across Pakistan who are getting surplus food to people who need it.</p>
    </aside>

    <section class="auth-main">
      <div class="auth-box">
        <div class="seg" id="seg" data-mode="login">
          <button type="button" id="tabLogin" class="on" onclick="setMode('login')">Log in</button>
          <button type="button" id="tabSignup" onclick="setMode('signup')">Sign up</button>
        </div>

        <form id="authForm" novalidate>
          <div class="reveal" id="signupFields">
            <div>
              <div class="roles" role="radiogroup" aria-label="I want to">
                <input type="radio" name="role" id="roleReceiver" value="RECEIVER" checked>
                <label for="roleReceiver"><strong>Receive food</strong><small>Claim and collect</small></label>
                <input type="radio" name="role" id="roleDonor" value="DONOR">
                <label for="roleDonor"><strong>Donate food</strong><small>Post what's left</small></label>
              </div>
              <label class="field"><span>Full name</span><input id="name" autocomplete="name"></label>
              <div class="row">
                <label class="field"><span>City</span><input id="city" autocomplete="address-level2"></label>
                <label class="field"><span>Phone</span><input id="phone" type="tel" autocomplete="tel"></label>
              </div>
            </div>
          </div>

          <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email"></label>
          <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>

          <p class="error-text" id="error" role="alert"></p>
          <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Log in</button>
        </form>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    renderNav('auth');
    if (getToken() && getUser()) location.href = 'dashboard.html';

    let mode = 'login';

    function setMode(m) {
      mode = m;
      document.getElementById('seg').dataset.mode = m;
      document.getElementById('signupFields').classList.toggle('open', m === 'signup');
      document.getElementById('tabLogin').classList.toggle('on', m === 'login');
      document.getElementById('tabSignup').classList.toggle('on', m === 'signup');
      document.getElementById('submitBtn').textContent = m === 'signup' ? 'Create account' : 'Log in';
      document.getElementById('password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
      document.getElementById('error').textContent = '';
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = (id) => document.getElementById(id).value.trim();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('error');
      errorBox.textContent = '';

      const body = { email: v('email'), password: document.getElementById('password').value };
      if (mode === 'signup') {
        Object.assign(body, {
          name: v('name'),
          role: document.querySelector('input[name="role"]:checked').value,
          city: v('city'),
          phone: v('phone'),
        });
      }

      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = 'Please wait...';
      try {
        const data = await api('/auth/' + mode, 'POST', body);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = 'dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        btn.disabled = false;
        btn.textContent = label;
      }
    });
  </script>
</body>
</html>
