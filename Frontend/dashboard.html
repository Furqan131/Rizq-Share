<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Rizq Share</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>

  <main class="container section">
    <div class="section-head">
      <div>
        <h2 id="title"></h2>
        <p class="muted" id="subtitle" style="margin:6px 0 0"></p>
      </div>
      <button class="btn btn-accent" id="postBtn" style="display:none" onclick="openPostForm()">Post food</button>
    </div>

    <div class="stats" id="stats"></div>

    <h3 id="listTitle" style="margin-bottom:16px"></h3>
    <div class="grid" id="list"></div>
  </main>

  <script src="app.js"></script>
  <script>
    renderNav('dashboard');
    const user = getUser();
    if (!user || !getToken()) location.href = 'auth.html';

    const isDonor = user.role === 'DONOR' || user.role === 'ADMIN';

    document.getElementById('title').textContent = `Welcome, ${user.name.split(' ')[0]}`;
    document.getElementById('subtitle').textContent = isDonor
      ? 'Post surplus food and confirm when it has been collected.'
      : 'Food you have claimed and its pickup details.';
    document.getElementById('listTitle').textContent = isDonor ? 'Your posts' : 'Your claims';
    if (isDonor) document.getElementById('postBtn').style.display = 'inline-flex';

    // A post that is still AVAILABLE but past its time is shown as expired
    const displayStatus = (p) =>
      p.status === 'AVAILABLE' && new Date(p.expiresAt) < new Date() ? 'EXPIRED' : p.status;

    const STATUS_LABEL = {
      AVAILABLE: 'Available',
      CLAIMED: isDonor ? 'Waiting for pickup' : 'To collect',
      COLLECTED: 'Collected',
      EXPIRED: 'Expired',
    };

    function renderStats(posts) {
      const count = (s) => posts.filter((p) => displayStatus(p) === s).length;
      const items = isDonor
        ? [[count('AVAILABLE'), 'Available now'], [count('CLAIMED'), 'Waiting for pickup'], [count('COLLECTED'), 'Collected']]
        : [[count('CLAIMED'), 'To collect'], [count('COLLECTED'), 'Collected']];
      document.getElementById('stats').innerHTML = items
        .map(([n, label]) => `<div class="stat"><strong>${n}</strong><span>${label}</span></div>`)
        .join('');
    }

    function card(p) {
      const status = displayStatus(p);
      const other = isDonor ? p.claimedBy : p.donor;
      const showTimer = status === 'AVAILABLE' || status === 'CLAIMED';
      return `
        <article class="card">
          <div class="card-top">
            <div>
              <h3>${esc(p.title)}</h3>
              <span class="pill">${esc(p.quantity)}</span>
            </div>
            <span class="chip ${status}">${STATUS_LABEL[status]}</span>
          </div>
          ${showTimer ? timerHTML(p, 'left') : `<p class="meta muted">Expires ${esc(fmtDate(p.expiresAt))}</p>`}
          <p class="meta">${ICON_PIN}<span>${esc(p.address)}, ${esc(p.area)}, ${esc(p.city)}</span></p>
          ${other
            ? `<p class="meta">${ICON_USER}<span>${isDonor ? 'Claimed by' : 'Shared by'} ${esc(other.name)}${other.phone ? ` · <a href="tel:${esc(other.phone)}">${esc(other.phone)}</a>` : ''}</span></p>`
            : ''}
          <div class="spacer"></div>
          ${isDonor && status === 'CLAIMED'
            ? `<button class="btn btn-primary btn-block" onclick="collect('${p.id}', this)">Mark as collected</button>`
            : ''}
        </article>`;
    }

    async function load() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
      try {
        const posts = await api(isDonor ? '/posts/my/posts' : '/posts/my/claims');
        renderStats(posts);

        if (posts.length === 0) {
          list.innerHTML = isDonor
            ? `<div class="empty" style="grid-column:1/-1">
                 <h3>You haven't posted any food yet</h3>
                 <p>Got extra food today? Share it in under a minute.</p>
                 <button class="btn btn-primary" onclick="openPostForm()">Post food</button>
               </div>`
            : `<div class="empty" style="grid-column:1/-1">
                 <h3>You haven't claimed any food yet</h3>
                 <p>Browse what's available near you and claim a meal.</p>
                 <a class="btn btn-primary" href="index.html#browse">Find food</a>
               </div>`;
          return;
        }

        list.innerHTML = posts.map(card).join('');
        startTimers();
      } catch (err) {
        if (!getToken()) { location.href = 'auth.html'; return; }
        list.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <h3>Couldn't load your posts</h3><p>${esc(err.message)}</p>
          <button class="btn btn-primary" onclick="load()">Try again</button></div>`;
      }
    }

    function openPostForm() {
      // datetime-local expects local time without a timezone suffix
      const soon = new Date(Date.now() + 60 * 60 * 1000);
      const min = new Date(soon.getTime() - soon.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

      openModal(`
        <h2>Post surplus food</h2>
        <p class="muted" style="margin-top:0">Receivers will see this in their city right away.</p>
        <form id="postForm" novalidate>
          <label class="field"><span>Title</span><input id="ftitle" placeholder="Chicken biryani from a wedding"></label>
          <label class="field"><span>Description (optional)</span><textarea id="fdesc" placeholder="Packed in trays, still warm"></textarea></label>
          <label class="field"><span>Quantity</span><input id="fquantity" placeholder="Feeds 25 people"></label>
          <div class="row">
            <label class="field"><span>City</span><input id="fcity" value="${esc(user.city || '')}"></label>
            <label class="field"><span>Area</span><input id="farea" placeholder="Gulshan-e-Iqbal"></label>
          </div>
          <label class="field"><span>Pickup address</span><input id="faddress" placeholder="Block 5, near Aladin Park"></label>
          <label class="field"><span>Best before</span><input id="fexpires" type="datetime-local" min="${min}"></label>
          <p class="error-text" id="formError" role="alert"></p>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="postSubmit">Post food</button>
          </div>
        </form>`);

      document.getElementById('postForm').addEventListener('submit', createPost);
      document.getElementById('ftitle').focus();
    }

    async function createPost(e) {
      e.preventDefault();
      const v = (id) => document.getElementById(id).value.trim();
      const expires = document.getElementById('fexpires').value;
      const btn = document.getElementById('postSubmit');
      const errorBox = document.getElementById('formError');
      errorBox.textContent = '';

      btn.disabled = true;
      btn.textContent = 'Posting...';
      try {
        await api('/posts', 'POST', {
          title: v('ftitle'),
          description: v('fdesc'),
          quantity: v('fquantity'),
          city: v('fcity'),
          area: v('farea'),
          address: v('faddress'),
          expiresAt: expires ? new Date(expires).toISOString() : '',
        });
        closeModal();
        toast('Food posted');
        load();
      } catch (err) {
        errorBox.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Post food';
      }
    }

    async function collect(id, btn) {
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        await api(`/posts/${id}/collect`, 'PATCH');
        toast('Marked as collected');
        load();
      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Mark as collected';
      }
    }

    load().then(() => {
      if (isDonor && new URLSearchParams(location.search).get('post') === '1') {
        history.replaceState(null, '', 'dashboard.html');
        openPostForm();
      }
    });
  </script>
</body>
</html>
