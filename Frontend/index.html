<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e3b2f" />
    <title>Rizq Share - Share surplus food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; }
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; font-family: system-ui, sans-serif; font-weight: 700; color: #0e3b2f; }
      .boot svg { animation: bootspin 1.1s linear infinite; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="26" fill="none" stroke="#dce5e0" stroke-width="6" />
          <circle cx="32" cy="32" r="26" fill="none" stroke="#0e3b2f" stroke-width="6" stroke-linecap="round" stroke-dasharray="60 104" />
        </svg>
        Rizq Share
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
